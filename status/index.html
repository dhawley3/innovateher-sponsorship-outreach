<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outreach setup status</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 16px;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1rem; margin-top: 2rem; color: #666; }
  ul { list-style: none; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(128,128,128,0.2);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .ok { background: #2ea043; }
  .bad { background: #d1242f; }
  .unknown { background: #9a9a9a; }
  .label { flex: 1; }
  .detail { font-size: 0.85rem; color: #888; }
  input[type="checkbox"] { width: 18px; height: 18px; }
  a { color: inherit; }
  #refresh { margin-top: 1.5rem; padding: 8px 16px; cursor: pointer; }
</style>
</head>
<body>
  <h1>InnovateHer sponsorship outreach — setup status</h1>

  <h2>Checked live</h2>
  <ul id="live"></ul>

  <button id="refresh">Recheck</button>

  <h2>Check yourself (can't verify these from localhost)</h2>
  <ul id="manual"></ul>

  <script>
    const manualItems = [
      { key: 'script-properties', label: 'Script Properties saved in the Apps Script editor (Project Settings)' },
      { key: 'team-emails', label: 'IH Team Emails sheet has at least one person in it' },
      { key: 'clasp-push', label: 'Latest code pushed (npx clasp push)' },
      { key: 'executions', label: 'Executions log is free of errors' }
    ];

    function renderManual() {
      const ul = document.getElementById('manual');
      ul.innerHTML = '';
      manualItems.forEach((item) => {
        const li = document.createElement('li');
        const checked = localStorage.getItem('check:' + item.key) === 'true';
        li.innerHTML = `
          <input type="checkbox" id="${item.key}" ${checked ? 'checked' : ''}>
          <label class="label" for="${item.key}">${item.label}</label>
        `;
        li.querySelector('input').addEventListener('change', (e) => {
          localStorage.setItem('check:' + item.key, e.target.checked);
        });
        ul.appendChild(li);
      });
    }

    function row(ok, label, detail) {
      const dotClass = ok === true ? 'ok' : ok === false ? 'bad' : 'unknown';
      return `<li><span class="dot ${dotClass}"></span><span class="label">${label}</span><span class="detail">${detail || ''}</span></li>`;
    }

    async function loadStatus() {
      const ul = document.getElementById('live');
      ul.innerHTML = '<li>Checking…</li>';

      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        const c = data.localConfig;

        ul.innerHTML =
          row(data.apollo.present && data.apollo.valid, 'Apollo API key', data.apollo.message) +
          row(c.MASTER_LIST_SPREADSHEET_ID, 'MASTER_LIST_SPREADSHEET_ID set in .env') +
          row(c.OUTREACH_GUIDE_DOC_ID, 'OUTREACH_GUIDE_DOC_ID set in .env') +
          row(c.EMAIL_TEMPLATE_DOC_ID, 'EMAIL_TEMPLATE_DOC_ID set in .env') +
          row(c.DIGEST_RECIPIENT_EMAIL, 'DIGEST_RECIPIENT_EMAIL set in .env');
      } catch (err) {
        ul.innerHTML = '<li>Failed to reach status server: ' + err.message + '</li>';
      }
    }

    document.getElementById('refresh').addEventListener('click', loadStatus);
    renderManual();
    loadStatus();
  </script>
</body>
</html>
